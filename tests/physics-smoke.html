<!doctype html>
<html lang="en"><meta charset="utf-8"><title>MuJoCo workbench test</title>
<style>body{margin:0;background:#eaeaea;font:13px system-ui}iframe{width:100%;height:calc(100vh - 38px);border:0}p{margin:0;padding:10px}a{color:inherit}</style>
<p>Physics test fixture: three boxes and a sweeper, no camera or hardware. Select the sweeper, then “Find &amp; run physical sweep”. <a href="../viewer/">Open normal viewer</a></p>
<iframe title="Physics workbench" src="../viewer/"></iframe>
<script type="module">
const frame = document.querySelector("iframe");
await new Promise(resolve => frame.addEventListener("load", resolve, {once:true}));
// The viewer has top-level async setup; iframe load can precede its controller.
if (!frame.contentDocument.getElementById("world-count").textContent.includes("MuJoCo"))
  await new Promise(resolve => frame.contentDocument.addEventListener("workbenchchange", resolve, {once:true}));
const put = record => frame.contentDocument.dispatchEvent(new frame.contentWindow.CustomEvent("worldplace", {detail:{record}}));
for (const [index,color] of ["red","blue","red"].entries()) put({id:`test_box_${index}`,type:"box",modelKey:"box",name:"Box",color,destination:color === "red" ? "left" : "right"});
put({id:"test_sweeper",type:"sweeper",modelKey:"sweeper",name:"Cylindrical Sweeper"});
</script></html>
